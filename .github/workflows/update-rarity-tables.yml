name: Update rarity AP tables

# 通常の定期更新は update-master-data.yml 内で master-data 更新に続けて統合実行されます。
# 本ワークフローは rarity テーブル単体を手動で再計算したい場合に使用します。
# 処理本体: scripts/run-rarity-updater.ts(指紋ゲートつき LP ソルブ → rarity_ap_tables)。

on:
  workflow_dispatch:

concurrency:
  group: update-rarity-tables
  cancel-in-progress: false

jobs:
  update:
    name: Update rarity AP tables KV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run rarity AP tables update
        run: pnpm exec tsx scripts/run-rarity-updater.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
