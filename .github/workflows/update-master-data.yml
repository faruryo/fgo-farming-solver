name: Update master data

# 旧 fgo-data-updater worker の移管先。
# Workers 無料プランは公称 CPU 10ms 超の invocation を確率的に kill するため
# (実測: 改善後でも定常 ~120ms → 時折 exceededCpu)、CPU 無制限の CI で実行する。
# 処理本体: scripts/run-updater.ts (drops / dashboard_meta / servants_list)
# および scripts/run-rarity-updater.ts (rarity_ap_tables)。
# 注: GitHub の schedule は混雑帯(:00/:15/:30/:45)で大幅に間引かれるため、混雑を避けた半端な分(:08)を指定。
# FGO 更新コアタイム (18:00 JST = 09:00 UTC) を含む 2 時間間隔 (UTC 奇数時) で実行。

on:
  schedule:
    - cron: '8 1-23/2 * * *'
  workflow_dispatch:

concurrency:
  group: update-master-data
  cancel-in-progress: false

jobs:
  update:
    name: Update master data and rarity tables KV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run master data update
        id: master
        run: pnpm exec tsx scripts/run-updater.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # run-updater.ts が all_drops_json を書き込んだ後、dashboard や servants の
      # 更新失敗で exit 1 となった場合でも、KV 上の新しい drops を基準に rarity_ap_tables
      # を追従・整合させるため、キャンセル・未実行以外では常に実行する
      # (scripts/run-rarity-updater.ts 自体の指紋ゲートで不要な再計算は安全にスキップされる)。
      - name: Run rarity AP tables update
        if: always() && steps.master.conclusion != 'skipped' && steps.master.conclusion != 'cancelled'
        run: pnpm exec tsx scripts/run-rarity-updater.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
