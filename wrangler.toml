name = "fgo-farming-solver"
main = ".open-next/worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "fgo-farming-solver"

[[kv_namespaces]]
binding = "CLOUD_SAVE"
id = "c621d47e509445a3a7f713702b3cb07e"

[[kv_namespaces]]
binding = "MASTER_DATA"
id = "306bbe537e9d4907809f82468df500e4"

[[d1_databases]]
binding = "DB"
database_name = "fgo-farming-solver-db"
database_id = "4bb0a615-9079-4233-b57f-a5725b9eb4da"

[vars]
NEXT_PUBLIC_SITE_URL = "https://fgo-farming-solver.faru.jp"
# 注: Cloudflare Web Analytics の beacon token は NEXT_PUBLIC_ のためビルド時インラインが必要。
# runtime var(ここ)では効かないので .github/workflows/deploy.yml の Build ステップで供給している。

[observability]
enabled = true

# プレビューは本番の KV / D1 を継承しない。ここは空の専用リソースだけを向ける。
[previews.vars]
PREVIEW_AUTH_HANDOFF = "1"

[[previews.kv_namespaces]]
binding = "CLOUD_SAVE"
id = "a6cff391f6d847a1925ebb70d94a4c46"

[[previews.kv_namespaces]]
binding = "MASTER_DATA"
id = "9d4d9cbdf56e4cb284d6c74234e40a5d"

[[previews.d1_databases]]
binding = "DB"
database_name = "fgo-farming-solver-preview-db"
database_id = "d7c3219a-3f26-4da3-b2dc-326dc3ec67e6"
